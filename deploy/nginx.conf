# HTTP -> HTTPS 跳转 + ACME 验证
server {
  listen 80;
  server_name zhengziheng.me www.zhengziheng.me;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# HTTPS 主站：静态前端 + /api 反代后端
server {
  listen 443 ssl;
  server_name zhengziheng.me www.zhengziheng.me;
  ssl_certificate     /etc/letsencrypt/live/zhengziheng.me/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zhengziheng.me/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header X-Real-IP $remote_addr;          # ★ 限流取真实 IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;                              # ★ SSE 必须关缓冲
    proxy_read_timeout 600s;                          # 评测等长耗时接口可达 2-4 分钟
  }

  location / { try_files $uri $uri/ /index.html; }    # SPA fallback
}
