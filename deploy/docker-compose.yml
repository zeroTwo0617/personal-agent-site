# 生产 compose：CI 构建镜像推 GHCR，服务器只 pull 运行（2C2G 服务器零构建，避免 OOM）
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: pa-pg
    command: ["postgres", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ragkb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ragkb}
      POSTGRES_DB: ${DB_NAME:-ragkb}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ragkb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/zeroTwo0617/personal-agent-backend:latest   # CI 构建推送(owner=GitHub 账号,与 CI 一致)
    container_name: pa-backend
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DB_HOST: pg
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ragkb}
      DB_USERNAME: ${DB_USERNAME:-ragkb}
      DB_PASSWORD: ${DB_PASSWORD:-ragkb}
      JAVA_OPTS: "-Xmx768m -Xms256m"
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL:-BAAI/bge-m3}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      LLM_THINKING_NORMAL: ${LLM_THINKING_NORMAL:-disabled}
      LLM_THINKING_AGENT: ${LLM_THINKING_AGENT:-low}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PERSONA_NAME: ${PERSONA_NAME:-邱俊景}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-50}
      LOGIN_RATE_LIMIT_PER_HOUR: ${LOGIN_RATE_LIMIT_PER_HOUR:-10}
    restart: unless-stopped

  nginx:
    image: ghcr.io/zeroTwo0617/personal-agent-frontend:latest   # CI 构建，dist 内置
    container_name: pa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg-data:
  certbot-webroot:
  certbot-certs:
